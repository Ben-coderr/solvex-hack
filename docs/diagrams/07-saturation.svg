 y1="74" x2="490.8" y2="74" style="stroke:#14181C;stroke-width:2.2"/><text x="498.8" y="78" font-family="'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start" style="fill:#14181C">what a ±8 g phone reports</text><line x1="84" y1="470.0" x2="770" y2="470.0" style="stroke:#B9B3A4;stroke-width:1.2"/><text x="74" y="474.0" font-family="'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="400" text-anchor="end" style="fill:#566270">0</text><line x1="84" y1="386.8888888888889" x2="770" y2="386.8888888888889" style="stroke:#B9B3A4;stroke-width:0.8"/><text x="74" y="390.8888888888889" font-family="'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="400" text-anchor="end" style="fill:#566270">8</text><line x1="84" y1="303.77777777777777" x2="770" y2="303.77777777777777" style="stroke:#B9B3A4;stroke-width:0.8"/><text x="74" y="307.77777777777777" font-family="'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="400" text-anchor="end" style="fill:#566270">16</text><line x1="84" y1="220.66666666666666" x2="770" y2="220.66666666666666" style="stroke:#B9B3A4;stroke-width:0.8"/><text x="74" y="224.66666666666666" font-family="'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="400" text-anchor="end" style="fill:#566270">24</text><line x1="84" y1="137.55555555555554" x2="770" y2="137.55555555555554" style="stroke:#B9B3A4;stroke-width:0.8"/><text x="74" y="141.55555555555554" font-family="'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="400" text-anchor="end" style="fill:#566270">32</text><line x1="84.0" y1="470" x2="84.0" y2="475" style="stroke:#566270
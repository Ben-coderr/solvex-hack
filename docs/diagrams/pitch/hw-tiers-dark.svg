<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="556" viewBox="0 0 1580 556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="mBLUE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B95FF"/></marker><marker id="mRED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF4757"/></marker><marker id="mGREEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3DD68C"/></marker><marker id="mMUT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA4B2"/></marker><marker id="mAMBER" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB020"/></marker></defs><rect x="0" y="0" width="600" height="128" rx="14" fill="#151A1F" stroke="#3DD68C" stroke-width="2"/><text x="20" y="30" font-size="15" fill="#3DD68C" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="20" dy="0">FREE · TODAY</tspan></text><text x="20" y="62" font-size="25" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="20" dy="0">Phone app</tspan></text><text x="20" y="92.4" font-size="19" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="20" dy="0">accelerometer, gyro, GPS;</tspan><tspan x="20" dy="24.7">saturates on hard impacts</tspan></text><path d="M600 64 C 680 64, 680 278, 742 278" fill="none" stroke="#5B95FF" stroke-width="3" marker-end="url(#mBLUE)"/><rect x="0" y="140" width="600" height="128" rx="14" fill="#151A1F" stroke="#3DD68C" stroke-width="2"/><text x="20" y="170" font-size="15" fill="#3DD68C" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="20" dy="0">FREE · TODAY</tspan></text><text x="20" y="202" font-size="25" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="20" dy="0">Witness</tspan></text><text x="20" y="232.4" font-size="19" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="20" dy="0">in the app (5 taps) or a</tspan><tspan x="20" dy="24.7">web link; no account</tspan></text><path d="M600 204 C 680 204, 680 278, 742 278" fill="none" stroke="#5B95FF" stroke-width="3" marker-end="url(#mBLUE)"/><rect x="0" y="280" width="600" height="128" rx="14" fill="#11161B" stroke="#2A313A" stroke-width="2" stroke-dasharray="10 7"/><text x="20" y="310" font-size="15" fill="#FFB020" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="20" dy="0">PAID · ROADMAP</tspan></text><text x="20" y="342" font-size="25" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="20" dy="0">OBD dongle</tspan></text><text x="20" y="372.4" font-size="19" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="20" dy="0">plugs into the diagnostic port;</tspan><tspan x="20" dy="24.7">wheel speed sharpens the speed drop</tspan></text><path d="M600 344 C 680 344, 680 278, 742 278" fill="none" stroke="#9AA4B2" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mMUT)"/><rect x="0" y="420" width="600" height="128" rx="14" fill="#11161B" stroke="#2A313A" stroke-width="2" stroke-dasharray="10 7"/><text x="20" y="450" font-size="15" fill="#FFB020" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="20" dy="0">PAID · ROADMAP</tspan></text><text x="20" y="482" font-size="25" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="20" dy="0">Sellekni Box (ESP32)</tspan></text><text x="20" y="512.4" font-size="19" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="20" dy="0">±200 g sensor sees the real crash pulse;</tspan><tspan x="20" dy="24.7">own GNSS, LTE and backup power</tspan></text><path d="M600 484 C 680 484, 680 278, 742 278" fill="none" stroke="#9AA4B2" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mMUT)"/><rect x="746" y="188" width="380" height="180" rx="16" fill="#151A1F" stroke="#FF4757" stroke-width="3"/><text x="770" y="233" font-size="16" fill="#FF4757" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="770" dy="0">SAME PACKET</tspan></text><text x="770" y="273" font-size="26" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="770" dy="0">one 160-character SMS</tspan></text><text x="770" y="310" font-size="20" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="770" dy="0">internet first, plain SMS</tspan><tspan x="770" dy="26.0">fallback, queued offline</tspan></text><path d="M1126 278 L1196 278" fill="none" stroke="#5B95FF" stroke-width="3" marker-end="url(#mBLUE)"/><rect x="1200" y="188" width="380" height="180" rx="16" fill="#151A1F" stroke="#5B95FF" stroke-width="2"/><text x="1224" y="233" font-size="16" fill="#5B95FF" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="1224" dy="0">SAME SERVER</tspan></text><text x="1224" y="273" font-size="26" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1224" dy="0">ops room + hospital</tspan></text><text x="1224" y="310" font-size="20" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1224" dy="0">one decoder for every</tspan><tspan x="1224" dy="26.0">source; a human decides</tspan></text></svg>
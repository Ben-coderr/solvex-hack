<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="425" viewBox="0 0 1664 425" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B95FF"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF4757"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA4B2"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3DD68C"/></marker>
</defs>
<rect x="0" y="0" width="250" height="210" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="24" y="52" font-size="34" fill="#5B95FF" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="24" dy="0">1</tspan></text><text x="24" y="104" font-size="29" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="24" dy="0">Armed</tspan></text><text x="24" y="148" font-size="23" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="24" dy="0">above 25 km/h</tspan><tspan x="24" dy="29.900000000000002">for 10 s</tspan></text><path d="M254 105 L279 105" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><rect x="283" y="0" width="250" height="210" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="307" y="52" font-size="34" fill="#5B95FF" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="307" dy="0">2</tspan></text><text x="307" y="104" font-size="29" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="307" dy="0">Impact</tspan></text><text x="307" y="148" font-size="23" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="307" dy="0">sustained,</tspan><tspan x="307" dy="29.900000000000002">not a single spike</tspan></text><path d="M537 105 L562 105" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><rect x="566" y="0" width="250" height="210" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="590" y="52" font-size="34" fill="#5B95FF" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="590" dy="0">3</tspan></text><text x="590" y="104" font-size="29" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="590" dy="0">Speed collapse</tspan></text><text x="590" y="148" font-size="23" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="590" dy="0">GPS speed falls</tspan><tspan x="590" dy="29.900000000000002">or the car rolls</tspan></text><path d="M820 105 L845 105" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><rect x="849" y="0" width="250" height="210" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="873" y="52" font-size="34" fill="#5B95FF" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="873" dy="0">4</tspan></text><text x="873" y="104" font-size="29" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="873" dy="0">Stopped</tspan></text><text x="873" y="148" font-size="23" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="873" dy="0">the vehicle</tspan><tspan x="873" dy="29.900000000000002">comes to rest</tspan></text><path d="M1103 105 L1128 105" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><rect x="1132" y="0" width="250" height="210" rx="16" fill="#151A1F" stroke="#FF4757" stroke-width="2"/><text x="1156" y="52" font-size="34" fill="#FF4757" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="1156" dy="0">5</tspan></text><text x="1156" y="104" font-size="29" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1156" dy="0">30 s alarm</tspan></text><text x="1156" y="148" font-size="23" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1156" dy="0">sound, vibration,</tspan><tspan x="1156" dy="29.900000000000002">voice: “I’m OK”</tspan></text><path d="M1386 105 L1411 105" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><rect x="1415" y="0" width="250" height="210" rx="16" fill="#151A1F" stroke="#3DD68C" stroke-width="2"/><text x="1439" y="52" font-size="34" fill="#3DD68C" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="1439" dy="0">6</tspan></text><text x="1439" y="104" font-size="29" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1439" dy="0">Alert sent</tspan></text><text x="1439" y="148" font-size="23" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1439" dy="0">internet, else SMS;</tspan><tspan x="1439" dy="29.900000000000002">queued if no signal</tspan></text><text x="0" y="290" font-size="22" fill="#9AA4B2" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="0" dy="0">FILTERED OUT BEFORE ANY ALERT</tspan></text><rect x="0" y="315" width="532" height="110" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><circle cx="44" cy="370" r="20" fill="none" stroke="#FF4757" stroke-width="4"/><path d="M32 358 L56 382 M56 358 L32 382" stroke="#FF4757" stroke-width="4"/><text x="84" y="360" font-size="27" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="84" dy="0">Phone dropped</tspan></text><text x="84" y="398" font-size="22" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="84" dy="0">never armed: the car wasn’t moving</tspan></text><rect x="566" y="315" width="532" height="110" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><circle cx="610" cy="370" r="20" fill="none" stroke="#FF4757" stroke-width="4"/><path d="M598 358 L622 382 M622 358 L598 382" stroke="#FF4757" stroke-width="4"/><text x="650" y="360" font-size="27" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="650" dy="0">Speed bump, pothole</tspan></text><text x="650" y="398" font-size="22" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="650" dy="0">too short to count as an impact</tspan></text><rect x="1132" y="315" width="532" height="110" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><circle cx="1176" cy="370" r="20" fill="none" stroke="#FF4757" stroke-width="4"/><path d="M1164 358 L1188 382 M1188 358 L1164 382" stroke="#FF4757" stroke-width="4"/><text x="1216" y="360" font-size="27" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1216" dy="0">Hard brake</tspan></text><text x="1216" y="398" font-size="22" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1216" dy="0">no impact, so no event</tspan></text>
</svg>
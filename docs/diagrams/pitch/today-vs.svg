<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="250" viewBox="0 0 1664 250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B95FF"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF4757"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA4B2"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3DD68C"/></marker>
</defs>
<text x="0" y="62" font-size="26" fill="#FF4757" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="0" dy="0">TODAY</tspan></text><rect x="200" y="0" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="220" y="42" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="220" dy="0">Crash</tspan></text><text x="220" y="76" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="220" dy="0">nobody may see it</tspan></text><path d="M474 50 L490 50" stroke="#FF4757" stroke-width="3" marker-end="url(#ar)"/><rect x="492" y="0" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="512" y="42" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="512" dy="0">Find a phone</tspan></text><text x="512" y="76" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="512" dy="0">in shock, at night</tspan></text><path d="M766 50 L782 50" stroke="#FF4757" stroke-width="3" marker-end="url(#ar)"/><rect x="784" y="0" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="804" y="42" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="804" dy="0">Dictate address</tspan></text><text x="804" y="76" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="804" dy="0">by voice</tspan></text><path d="M1058 50 L1074 50" stroke="#FF4757" stroke-width="3" marker-end="url(#ar)"/><rect x="1076" y="0" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="1096" y="42" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1096" dy="0">Severity</tspan></text><text x="1096" y="76" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1096" dy="0">unknown until arrival</tspan></text><path d="M1350 50 L1366 50" stroke="#FF4757" stroke-width="3" marker-end="url(#ar)"/><rect x="1368" y="0" width="272" height="100" rx="14" fill="#151A1F" stroke="#FF4757" stroke-width="2"/><text x="1388" y="42" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1388" dy="0">Nearest hospital</tspan></text><text x="1388" y="76" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1388" dy="0">not always the right one</tspan></text><text x="0" y="212" font-size="26" fill="#5B95FF" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="0" dy="0">SELLEKNI</tspan></text><rect x="200" y="150" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="220" y="192" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="220" dy="0">Crash</tspan></text><text x="220" y="226" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="220" dy="0">the phone detects it</tspan></text><path d="M474 200 L490 200" stroke="#5B95FF" stroke-width="3" marker-end="url(#ab)"/><rect x="492" y="150" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="512" y="192" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="512" dy="0">30 s to cancel</tspan></text><text x="512" y="226" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="512" dy="0">then it sends itself</tspan></text><path d="M766 200 L782 200" stroke="#5B95FF" stroke-width="3" marker-end="url(#ab)"/><rect x="784" y="150" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="804" y="192" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="804" dy="0">Exact position</tspan></text><text x="804" y="226" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="804" dy="0">in the packet</tspan></text><path d="M1058 200 L1074 200" stroke="#5B95FF" stroke-width="3" marker-end="url(#ab)"/><rect x="1076" y="150" width="272" height="100" rx="14" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><text x="1096" y="192" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1096" dy="0">Estimated risk</tspan></text><text x="1096" y="226" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1096" dy="0">with its reasons</tspan></text><path d="M1350 200 L1366 200" stroke="#5B95FF" stroke-width="3" marker-end="url(#ab)"/><rect x="1368" y="150" width="272" height="100" rx="14" fill="#151A1F" stroke="#3DD68C" stroke-width="2"/><text x="1388" y="192" font-size="24" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="1388" dy="0">Right hospital</tspan></text><text x="1388" y="226" font-size="21" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="1388" dy="0">pre-alerted, if confirmed</tspan></text>
</svg>
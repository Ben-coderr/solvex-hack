<rect x="0" y="90" width="330" height="190" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><rect x="0" y="108" width="6" height="154" rx="3" fill="#FF4757"/><text x="30" y="136" font-size="26" fill="#FF4757" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="30" dy="0">1</tspan></text><text x="74" y="136" font-size="30" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="74" dy="0">Driver’s phone</tspan></text><text x="30" y="180" font-size="24" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="30" dy="0">detects the crash</tspan><tspan x="30" dy="31.200000000000003">30 s alarm: “I’m OK”</tspan><tspan x="30" dy="31.200000000000003">queues if no signal</tspan></text><rect x="0" y="360" width="330" height="150" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><rect x="0" y="378" width="6" height="114" rx="3" fill="#FFB020"/><text x="30" y="406" font-size="30" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Witness</tspan></text><text x="30" y="450" font-size="24" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="30" dy="0">in the app or web link</tspan><tspan x="30" dy="31.200000000000003">no account, 5 taps</tspan></text><rect x="510" y="215" width="280" height="190" rx="16" fill="#151A1F" stroke="#2A313A" stroke-width="2"/><rect x="510" y="233" width="6" height="154" rx="3" fill="#5B95FF"/><text x="540" y="261" font-size="26" fill="#5B95FF" font-weight="800" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="540" dy="0">2</tspan></text><text x="584" y="261" font-size="30" fill="#E8ECF1" font-weight="700" text-anchor="start"><tspan x="584" dy="0">Gateway</tspan></text><text x="540" y="305" font-size="24" fill="#BFC8D4" font-weight="400" text-anchor="start"><tspan x="540" dy="0">decodes, checks</tspan><tspan x="540" dy="31.200000000000003">merges duplicate</tspan><tspan x="540" dy="31.200000000000003">reports</tspan></text>
000000000003">acknowledges</tspan></text><path d="M330 160 C 420 160, 420 255, 506 255" fill="none" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><path d="M330 225 C 420 225, 420 300, 506 300" fill="none" stroke="#FF4757" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#ar)"/><text x="338" y="140" font-size="22" fill="#5B95FF" font-weight="700" text-anchor="start"><tspan x="338" dy="0">Internet</tspan></text><text x="338" y="330" font-size="22" fill="#FF4757" font-weight="700" text-anchor="start"><tspan x="338" dy="0">or plain SMS</tspan></text><path d="M330 435 C 420 435, 420 360, 506 360" fill="none" stroke="#FFB020" stroke-width="4" marker-end="url(#ab)"/><path d="M790 310 L896 310" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><path d="M1180 280 C 1235 280, 1230 185, 1286 185" fill="none" stroke="#5B95FF" stroke-width="4" marker-end="url(#ab)"/><path d="M1477 280 L1477 356" stroke="#3DD68C" stroke-width="4" marker-end="url(#ag)"/><text x="1492" y="330" font-size="22" fill="#3DD68C" font-weight="700" text-anchor="start"><tspan x="1492" dy="0">1-click pre-alert</tspan></text><path d="M165 90 L165 30 L1477 30 L1477 86" fill="none" stroke="#9AA4B2" stroke-width="3" stroke-dasharray="4 8" marker-end="url(#am)"/><rect x="560" y="12" width="560" height="36" fill="#0D1013"/><text x="840" y="40" font-size="24" fill="#9AA4B2" font-weight="600" text-anchor="middle"><tspan x="840" dy="0">the voice call to 14 / 1021 still happens</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="600" viewBox="0 0 1570 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="mBLUE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FE0"/></marker><marker id="mRED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D92B3A"/></marker><marker id="mGREEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#12865A"/></marker><marker id="mMUT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6776"/></marker><marker id="mAMBER" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A86500"/></marker></defs><rect x="230" y="0" width="1010" height="470" rx="18" fill="none" stroke="#C9D2DC" stroke-width="2" stroke-dasharray="10 7"/><text x="254" y="32" font-size="15" fill="#5B6776" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="254" dy="0">SELLEKNI BOX · ROADMAP · NOT BUILT</tspan></text><rect x="0" y="170" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="2"/><text x="20" y="208" font-size="22" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="20" dy="0">12 / 24 V</tspan></text><text x="20" y="236.8" font-size="18" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="20" dy="0">OBD pin 16</tspan><tspan x="20" dy="23.400000000000002">or fuse tap</tspan></text><rect x="260" y="60" width="250" height="120" rx="14" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="2"/><text x="280" y="98" font-size="21" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="280" dy="0">Surge guard + buck</tspan></text><text x="280" y="126.8" font-size="18" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="280" dy="0">5 V / 3.3 V</tspan><tspan x="280" dy="23.400000000000002">load-dump safe</tspan></text><rect x="260" y="300" width="250" height="140" rx="14" fill="#FFFFFF" stroke="#A86500" stroke-width="2"/><text x="280" y="338" font-size="21" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="280" dy="0">Backup power</tspan></text><text x="280" y="366.8" font-size="18" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="280" dy="0">supercap or cell:</tspan><tspan x="280" dy="23.400000000000002">radio stays alive</tspan><tspan x="280" dy="23.400000000000002">after a power cut</tspan></text><rect x="580" y="170" width="300" height="140" rx="14" fill="#FFFFFF" stroke="#D92B3A" stroke-width="3"/><text x="602" y="210" font-size="26" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="602" dy="0">ESP32 MCU</tspan></text><text x="602" y="245" font-size="18" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="602" dy="0">same detector rules,</tspan><tspan x="602" dy="23.400000000000002">packet encoder (C port)</tspan></text><rect x="560" y="30" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/><text x="580" y="68" font-size="20" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="580" dy="0">±200 g accel.</tspan></text><text x="580" y="95.2" font-size="17" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="580" dy="0">ADXL375-class</tspan></text><rect x="780" y="30" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/><text x="800" y="68" font-size="20" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="800" dy="0">6-axis IMU</tspan></text><text x="800" y="95.2" font-size="17" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="800" dy="0">orientation, rollover</tspan></text><rect x="560" y="340" width="220" height="110" rx="14" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/><text x="580" y="378" font-size="20" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="580" dy="0">LTE + GNSS</tspan></text><text x="580" y="405.2" font-size="17" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="580" dy="0">modem, nano-SIM</tspan></text><rect x="800" y="340" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/><text x="820" y="378" font-size="20" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="820" dy="0">Cancel button</tspan></text><text x="820" y="405.2" font-size="17" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="820" dy="0">+ buzzer: “I’m OK”</tspan></text><rect x="1010" y="190" width="210" height="110" rx="14" fill="#F4F6F9" stroke="#C9D2DC" stroke-width="2" stroke-dasharray="10 7"/><text x="1030" y="228" font-size="20" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="1030" dy="0">CAN / OBD</tspan></text><text x="1030" y="255.2" font-size="17" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="1030" dy="0">optional: wheel</tspan><tspan x="1030" dy="22.1">speed</tspan></text><path d="M190 230 C 220 230, 225 120, 256 120" fill="none" stroke="#5B6776" stroke-width="3" marker-end="url(#mMUT)"/><path d="M510 120 C 545 120, 545 220, 576 220" fill="none" stroke="#5B6776" stroke-width="3" marker-end="url(#mMUT)"/><path d="M510 370 C 545 370, 545 270, 576 270" fill="none" stroke="#A86500" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mAMBER)"/><path d="M660 140 L660 166" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><path d="M880 140 L800 166" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><path d="M670 310 L670 336" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><path d="M820 310 L880 336" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><path d="M880 245 L1006 245" fill="none" stroke="#5B6776" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mMUT)"/><path d="M670 450 L670 486 L1420 486 L1420 330" fill="none" stroke="#D92B3A" stroke-width="3" marker-end="url(#mRED)"/><rect x="1270" y="170" width="300" height="156" rx="14" fill="#FFFFFF" stroke="#D92B3A" stroke-width="2"/><text x="1290" y="210" font-size="24" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="1290" dy="0">Same packet</tspan></text><text x="1290" y="245" font-size="18" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="1290" dy="0">HTTPS first,</tspan><tspan x="1290" dy="23.400000000000002">SMS fallback, to the</tspan><tspan x="1290" dy="23.400000000000002">same server</tspan></text><text x="0" y="522" font-size="15" fill="#5B6776" font-weight="700" text-anchor="start" font-family="Menlo, Courier New, monospace"><tspan x="0" dy="0">FIRMWARE FLOW · same rules as the phone</tspan></text><rect x="0" y="540" width="245" height="56" rx="10" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="2"/><text x="122.5" y="575" font-size="18" fill="#141A21" font-weight="600" text-anchor="middle"><tspan x="122.5" dy="0">sample at max rate</tspan></text><path d="M247 568 L265 568" fill="none" stroke="#2F6FE0" stroke-width="2" marker-end="url(#mBLUE)"/><rect x="267" y="540" width="245" height="56" rx="10" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="2"/><text x="389.5" y="575" font-size="18" fill="#141A21" font-weight="600" text-anchor="middle"><tspan x="389.5" dy="0">ring buffer</tspan></text><path d="M514 568 L532 568" fill="none" stroke="#2F6FE0" stroke-width="2" marker-end="url(#mBLUE)"/><rect x="534" y="540" width="245" height="56" rx="10" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="2"/><text x="656.5" y="575" font-size="18" fill="#141A21" font-weight="600" text-anchor="middle"><tspan x="656.5" dy="0">trigger ≥ 4 g</tspan></text><path d="M781 568 L799 568" fill="none" stroke="#2F6FE0" stroke-width="2" marker-end="url(#mBLUE)"/><rect x="801" y=
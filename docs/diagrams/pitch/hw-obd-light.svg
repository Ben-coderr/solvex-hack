<svg xmlns="http://www.w3.org/2000/svg" width="1608" height="150" viewBox="0 0 1608 150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="mBLUE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FE0"/></marker><marker id="mRED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D92B3A"/></marker><marker id="mGREEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#12865A"/></marker><marker id="mMUT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6776"/></marker><marker id="mAMBER" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A86500"/></marker></defs><rect x="0" y="0" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="2"/><text x="22" y="46" font-size="26" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="22" dy="0">Car</tspan></text><text x="22" y="88" font-size="20" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="22" dy="0">OBD-II port under the dash</tspan><tspan x="22" dy="26.0">pin 16: permanent +12 V</tspan></text><path d="M364 75 L410 75" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><rect x="416" y="0" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#A86500" stroke-width="2"/><text x="438" y="46" font-size="26" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="438" dy="0">OBD dongle</tspan></text><text x="438" y="88" font-size="20" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="438" dy="0">Bluetooth LE, ELM327-type</tspan><tspan x="438" dy="26.0">initialised with AT commands</tspan></text><path d="M780 75 L826 75" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><rect x="832" y="0" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/><text x="854" y="46" font-size="26" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="854" dy="0">Phone app</tspan></text><text x="854" y="88" font-size="20" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="854" dy="0">reads Mode 01 PID 0D</tspan><tspan x="854" dy="26.0">vehicle speed, km/h</tspan></text><path d="M1196 75 L1242 75" fill="none" stroke="#2F6FE0" stroke-width="3" marker-end="url(#mBLUE)"/><rect x="1248" y="0" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#D92B3A" stroke-width="2"/><text x="1270" y="46" font-size="26" fill="#141A21" font-weight="700" text-anchor="start"><tspan x="1270" dy="0">Same detector</tspan></text><text x="1270" y="88" font-size="20" fill="#3A4553" font-weight="400" text-anchor="start"><tspan x="1270" dy="0">wheel speed + phone sensors</tspan><tspan x="1270" dy="26.0">sharper speed drop</tspan></text></svg>